<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 DDNS IP 监控面板</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .card { max-width: 600px; margin: 0 auto 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2, h3 { margin-top: 0; color: #333; }
        
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .status-box { background: #eef9f2; border: 1px solid #c3e6cb; color: #155724; padding: 12px; border-radius: 8px; text-align: center; }
        .status-box .val { font-size: 18px; font-weight: bold; margin-top: 4px; }
        .status-box .lbl { font-size: 12px; color: #666; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input[type="text"], input[type="number"], input[type="email"], input[type="url"], input[type="password"], select { 
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; 
        }

        /* Toggle 开关样式 */
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #e9ecef; margin-bottom: 15px; }
        .switch-label { font-size: 14px; font-weight: bold; color: #333; }
        .switch-desc { font-size: 12px; color: #6c757d; margin-top: 2px; }
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #28a745; }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        
        .log-container { background: #1e1e1e; color: #00ff66; padding: 15px; border-radius: 8px; font-family: "Courier New", Courier, monospace; font-size: 12px; height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🌐 DDNS IP 监控面板</h2>
        
        <div class="status-grid">
            <div class="status-box">
                <div class="lbl">当前公网 IP</div>
                <div class="val">{{if .Status.LastIP}}{{.Status.LastIP}}{{else}}查询中...{{end}}</div>
            </div>
            <div class="status-box" style="background:#e8f4f8; border-color:#b8daff; color:#004085;">
                <div class="lbl">查询耗时 (响应速度)</div>
                <div class="val">{{if .Status.QueryTime}}{{.Status.QueryTime}} ms{{else}}-{{end}}</div>
            </div>
        </div>

        <form method="POST">
            <!-- 允许公网访问开关 -->
            <div class="switch-container">
                <div>
                    <div class="switch-label">允许公网访问 Web 面板</div>
                    <div class="switch-desc">关闭后仅允许局域网内网 IP (192.168.x / 10.x / 127.0.0.1) 访问控制台</div>
                </div>
                <label class="switch">
                    <input type="checkbox" name="allow_public" {{if .Config.AllowPublic}}checked{{end}}>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-group">
                <label>检测间隔 (分钟)</label>
                <input type="number" name="interval_minutes" value="{{.Config.IntervalMinutes}}" min="1" required>
            </div>
            <div class="form-group">
                <label>通知通道</label>
                <select name="notify_type" id="notifyType" onchange="toggleFields()">
                    <option value="webhook" {{if eq .Config.NotifyType "webhook"}}selected{{end}}>Webhook (Server酱/PushPlus/WxPusher)</option>
                    <option value="email" {{if eq .Config.NotifyType "email"}}selected{{end}}>SMTP 邮件 (SSL 端口)</option>
                </select>
            </div>

            <div id="webhookSection">
                <div class="form-group">
                    <label>Webhook URL</label>
                    <input type="url" name="webhook_url" value="{{.Config.WebhookURL}}" placeholder="https://wxpusher.zjiecode.com/api/send/message/AT_xxx/UID_xxx">
                </div>
            </div>

            <div id="emailSection" style="display:none;">
                <div class="form-group"><label>SMTP 服务器</label><input type="text" name="smtp_host" value="{{.Config.SMTPHost}}" placeholder="smtp.qq.com"></div>
                <div class="form-group"><label>SSL 端口</label><input type="text" name="smtp_port" value="{{.Config.SMTPPort}}" placeholder="465"></div>
                <div class="form-group"><label>发件邮箱账号</label><input type="text" name="smtp_user" value="{{.Config.SMTPUser}}"></div>
                <div class="form-group"><label>发件人名称 (显示名称)</label><input type="text" name="sender_name" value="{{.Config.SenderName}}" placeholder="例如: IP监控助手"></div>
                <div class="form-group"><label>发件密码/授权码</label><input type="password" name="smtp_pass" value="{{.Config.SMTPPass}}"></div>
                <div class="form-group"><label>接收邮箱</label><input type="email" name="to_email" value="{{.Config.ToEmail}}"></div>
            </div>

            <div class="btn-group">
                <button type="submit" name="action" value="save" class="btn-primary">保存配置</button>
                <button type="submit" name="action" value="test" class="btn-secondary">保存并测试发送</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h3>📋 实时运行日志</h3>
        <div class="log-container" id="logBox">加载日志中...</div>
    </div>

    <script>
        function toggleFields() {
            var type = document.getElementById("notifyType").value;
            document.getElementById("webhookSection").style.display = type === "webhook" ? "block" : "none";
            document.getElementById("emailSection").style.display = type === "email" ? "block" : "none";
        }
        toggleFields();

        function fetchLogs() {
            fetch('/api/logs')
                .then(response => response.json())
                .then(logs => {
                    const logBox = document.getElementById('logBox');
                    const isAtBottom = logBox.scrollHeight - logBox.clientHeight <= logBox.scrollTop + 20;
                    logBox.innerText = logs.join('\n');
                    if (isAtBottom) {
                        logBox.scrollTop = logBox.scrollHeight;
                    }
                })
                .catch(err => console.error("获取日志失败:", err));
        }

        fetchLogs();
        setInterval(fetchLogs, 3000);
    </script>
</body>
</html>
