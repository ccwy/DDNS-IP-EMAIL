<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP 变动通知设置</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .card { max-width: 600px; margin: 0 auto 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2, h3 { margin-top: 0; color: #333; }
        .status { background: #eef9f2; color: #1e7e34; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        
        /* 日志控制台样式 */
        .log-container { background: #1e1e1e; color: #00ff66; padding: 15px; border-radius: 8px; font-family: "Courier New", Courier, monospace; font-size: 12px; height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🌐 IP 监控通知配置</h2>
        <div class="status">当前监控 IP: {{if .LastIP}}{{.LastIP}}{{else}}正在获取...{{end}}</div>
        <form method="POST">
            <div class="form-group">
                <label>检测间隔 (分钟)</label>
                <input type="number" name="interval_minutes" value="{{.Config.IntervalMinutes}}" min="1" required>
            </div>
            <div class="form-group">
                <label>通知通道</label>
                <select name="notify_type" id="notifyType" onchange="toggleFields()">
                    <option value="webhook" {{if eq .Config.NotifyType "webhook"}}selected{{end}}>Webhook (Server酱/PushPlus/Telegram)</option>
                    <option value="email" {{if eq .Config.NotifyType "email"}}selected{{end}}>SMTP 邮件 (支持 465 SSL)</option>
                </select>
            </div>

            <div id="webhookSection">
                <div class="form-group">
                    <label>Webhook URL</label>
                    <input type="url" name="webhook_url" value="{{.Config.WebhookURL}}" placeholder="https://www.pushplus.plus/send">
                </div>
            </div>

            <div id="emailSection" style="display:none;">
                <div class="form-group"><label>SMTP 服务器</label><input type="text" name="smtp_host" value="{{.Config.SMTPHost}}" placeholder="smtp.qq.com"></div>
                <div class="form-group"><label>SSL 端口</label><input type="text" name="smtp_port" value="{{.Config.SMTPPort}}" placeholder="465"></div>
                <div class="form-group"><label>发件邮箱账号</label><input type="text" name="smtp_user" value="{{.Config.SMTPUser}}"></div>
                <div class="form-group"><label>发件密码/授权码</label><input type="password" name="smtp_pass" value="{{.Config.SMTPPass}}"></div>
                <div class="form-group"><label>接收邮箱</label><input type="email" name="to_email" value="{{.Config.ToEmail}}"></div>
            </div>

            <div class="btn-group">
                <button type="submit" name="action" value="save" class="btn-primary">保存配置</button>
                <button type="submit" name="action" value="test" class="btn-secondary">保存并测试发送</button>
            </div>
        </form>
    </div>

    <!-- 实时日志显示区域 -->
    <div class="card">
        <h3>📋 实时运行日志</h3>
        <div class="log-container" id="logBox">正在加载日志...</div>
    </div>

    <script>
        function toggleFields() {
            var type = document.getElementById("notifyType").value;
            document.getElementById("webhookSection").style.display = type === "webhook" ? "block" : "none";
            document.getElementById("emailSection").style.display = type === "email" ? "block" : "none";
        }
        toggleFields();

        // 轮询刷新日志
        function fetchLogs() {
            fetch('/api/logs')
                .then(response => response.json())
                .then(logs => {
                    const logBox = document.getElementById('logBox');
                    const isAtBottom = logBox.scrollHeight - logBox.clientHeight <= logBox.scrollTop + 20;
                    logBox.innerText = logs.join('\n');
                    // 如果原本滚动条在底部，保持自动置底
                    if (isAtBottom) {
                        logBox.scrollTop = logBox.scrollHeight;
                    }
                })
                .catch(err => console.error("获取日志失败:", err));
        }

        fetchLogs();
        setInterval(fetchLogs, 3000); // 每 3 秒自动更新一次日志
    </script>
</body>
</html>
