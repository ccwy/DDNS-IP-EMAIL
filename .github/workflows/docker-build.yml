name: 自动化构建发布

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🐳 Docker 构建与发布
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: 🔖 提取版本号
        id: version
        run: |
          HAS_VERSION=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            HAS_VERSION=true
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            TAG_NAME=$(echo "$COMMIT_MSG" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            if [ -n "$TAG_NAME" ]; then
              HAS_VERSION=true
            fi
          fi
          if [ "$HAS_VERSION" = true ]; then
            VERSION="${TAG_NAME#v}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "has_version=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到版本号: $TAG_NAME"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "has_version=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 未检测到版本号，跳过发布"
          fi

      - name: 🔧 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏗️ 构建 Docker 镜像
        run: |
          docker build --platform linux/amd64 -t ddns-notifier:latest .

      - name: 📦 导出镜像
        run: |
          docker save ddns-notifier:latest -o ddns-notifier-amd64.tar

      - name: 📦 重命名镜像文件（含版本号）
        if: steps.version.outputs.has_version == 'true'
        run: |
          mv ddns-notifier-amd64.tar "ddns-notifier-amd64-${{ steps.version.outputs.tag }}.tar"

      - name:  上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ddns-notifier-docker
          path: |
            ddns-notifier-amd64-*.tar
            ddns-notifier-amd64.tar
          retention-days: 30

      - name: 🚀 发布到 Release
        if: steps.version.outputs.has_version == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DDNS IP 变动通知 ${{ steps.version.outputs.tag }}
          body: |
            DDNS IP 变动通知工具 ${{ steps.version.outputs.tag }}

            ## 使用方法
            1. 下载 `ddns-notifier-amd64-${{ steps.version.outputs.tag }}.tar`
            2. 在群晖 Container Manager 中导入镜像，或使用命令: `docker load -i ddns-notifier-amd64-${{ steps.version.outputs.tag }}.tar`
            3. 运行容器，网络模式选择 **host**
            4. 配置 `/data` 存储映射
            5. 访问 `http://<NAS-IP>:49809` 进行配置
          files: |
            ddns-notifier-amd64-*.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}